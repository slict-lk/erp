<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ API Test - CORS Fixed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
        .info { background: #d1ecf1; color: #0c5460; border-left: 5px solid #17a2b8; }
        .warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px 10px 10px 0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        pre {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 13px;
            border: 1px solid #dee2e6;
        }
        .property-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid #667eea30;
        }
        .property-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .property-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 5px 5px 5px 0;
        }
        .badge-primary { background: #667eea; color: white; }
        .badge-success { background: #28a745; color: white; }
        .badge-info { background: #17a2b8; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 CORS Fix Verification</h1>
        <p style="color: #666; margin-bottom: 30px;">Testing connection to: <code>http://localhost:3000/api/public/real-estate/properties</code></p>

        <button onclick="runTest()">🔍 Run Full Test</button>
        <button onclick="quickTest()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">⚡ Quick Test</button>
        <button onclick="clearResults()" style="background: linear-gradient(135deg, #6c757d 0%, #495057 100%);">🗑️ Clear</button>

        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/public/real-estate/properties';
        const results = document.getElementById('results');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            results.innerHTML = '';
        }

        async function quickTest() {
            clearResults();
            log('⚡ Running quick test...', 'info');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (response.ok) {
                    log(`✅ SUCCESS! Got ${data.length} properties from API`, 'success');

                    if (data.length > 0) {
                        data.forEach((prop, index) => {
                            const card = document.createElement('div');
                            card.className = 'property-card';
                            card.innerHTML = `
                                <div class="property-title">${index + 1}. ${prop.title || 'Untitled'}</div>
                                <div class="property-price">LKR ${(prop.price || 0).toLocaleString()}</div>
                                <div>
                                    <span class="badge badge-primary">${prop.propertyType || 'N/A'}</span>
                                    <span class="badge badge-info">${prop.city || 'N/A'}</span>
                                    <span class="badge badge-success">${prop.bedrooms || 0} BR / ${prop.bathrooms || 0} BA</span>
                                </div>
                                <p style="margin-top: 10px; color: #666;">${(prop.description || '').substring(0, 100)}...</p>
                            `;
                            results.appendChild(card);
                        });
                    } else {
                        log('ℹ️ No properties in database yet', 'info');
                    }
                } else {
                    log(`❌ Server returned error: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ FAILED: ${error.message}`, 'error');
                log('⚠️ Make sure your Next.js server is running!', 'warning');
            }
        }

        async function runTest() {
            clearResults();
            log('🔄 Running comprehensive test...', 'info');

            // Step 1: Check origin
            log(`<strong>Your Origin:</strong> ${window.location.origin}`, 'info');

            // Step 2: Fetch test
            try {
                const startTime = performance.now();
                const response = await fetch(API_URL, {
                    method: 'GET',
                    mode: 'cors',
                });
                const endTime = performance.now();

                log(`✅ Response time: ${Math.round(endTime - startTime)}ms`, 'success');
                log(`✅ Status: ${response.status} ${response.statusText}`, 'success');

                // Step 3: Check CORS headers
                const corsHeader = response.headers.get('Access-Control-Allow-Origin');
                if (corsHeader) {
                    log(`✅ CORS Header: <code>${corsHeader}</code>`, 'success');
                } else {
                    log('❌ No CORS header found!', 'error');
                }

                // Step 4: Parse JSON
                const data = await response.json();

                if (Array.isArray(data)) {
                    log(`✅ Valid JSON array with ${data.length} items`, 'success');

                    if (data.length > 0) {
                        log('<strong>📊 Properties Found:</strong>', 'info');

                        data.forEach((prop, index) => {
                            const card = document.createElement('div');
                            card.className = 'property-card';
                            card.innerHTML = `
                                <div class="property-title">${index + 1}. ${prop.title || 'Untitled Property'}</div>
                                <div class="property-price">LKR ${(prop.price || 0).toLocaleString('en-LK')}</div>
                                <div>
                                    <span class="badge badge-primary">${prop.propertyType || 'N/A'}</span>
                                    <span class="badge badge-info">${prop.city || 'Location N/A'}</span>
                                    <span class="badge badge-success">${prop.bedrooms || 0} Bedrooms, ${prop.bathrooms || 0} Bathrooms</span>
                                </div>
                                <p style="margin-top: 10px; color: #666; font-size: 14px;">
                                    ${(prop.description || 'No description available').substring(0, 150)}${prop.description?.length > 150 ? '...' : ''}
                                </p>
                                <p style="margin-top: 8px; font-size: 13px; color: #888;">
                                    <strong>Address:</strong> ${prop.address || 'N/A'}<br>
                                    <strong>Area:</strong> ${prop.area || 'N/A'} sq ft<br>
                                    <strong>Images:</strong> ${prop.images?.length || 0} photo(s)
                                </p>
                            `;
                            results.appendChild(card);
                        });

                        log(`🎉 <strong>ALL TESTS PASSED!</strong> Your API is working perfectly!`, 'success');
                    } else {
                        log('ℹ️ Database is empty. Add properties to see them here.', 'info');
                        log('🎉 <strong>CORS IS FIXED!</strong> API is accessible, just needs data.', 'success');
                    }
                } else {
                    log('⚠️ Unexpected response format', 'warning');
                    log(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                }

            } catch (error) {
                log(`❌ Connection failed: ${error.message}`, 'error');

                if (error.message.includes('Failed to fetch')) {
                    log('<strong>Possible Issues:</strong>', 'error');
                    log('1. ❌ Next.js server not running on port 3000', 'warning');
                    log('2. ❌ Server was not restarted after CORS fix', 'warning');
                    log('3. ❌ Browser cache needs clearing (try Incognito mode)', 'warning');
                    log('<strong>Solution:</strong> Restart your Next.js server with <code>npm run dev</code>', 'info');
                } else {
                    log(`Unexpected error: ${error.stack}`, 'error');
                }
            }
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            setTimeout(quickTest, 300);
        });
    </script>
</body>
</html>
